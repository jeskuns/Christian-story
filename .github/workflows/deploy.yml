name: Global Story Collection & Deploy

# 每天 UTC 20:00（北京时间次日 04:00）从全世界网站搜罗故事并发布。
# push 时如果数据库里还没有任何判别通过的故事，也先跑一次完整搜罗，避免部署空站；
# 已有数据则只离线重建，不重复采集。
"on":
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "config/**"
      - "src/**"
      - "site/assets/**"
      - "run.py"
      - "requirements.txt"
      - "_headers"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write

concurrency:
  group: story-collect
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide whether a fresh collection is needed
        id: need_collect
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python -c 'import json,sys; a=json.load(open("data/db/articles.json",encoding="utf-8")).get("articles",[]); sys.exit(0 if any((x.get("extra") or {}).get("story_score") for x in a) else 1)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "库里还没有判别通过的故事，本次 push 先跑完整搜罗"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect stories from global sources
        id: collect
        if: steps.need_collect.outputs.run == 'true'
        run: python run.py full --workers 8

      - name: Rebuild site from existing data
        if: steps.need_collect.outputs.run != 'true'
        run: python run.py generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Pages project exists
        run: npx --yes wrangler@latest pages project create "christian-story" --production-branch=master || echo "project exists (ok)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy site --project-name="christian-story" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 把每日新搜罗的故事与译文缓存回推仓库，保留历史
      - name: Commit refreshed content
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "ChristianStory Bot"
          git config user.email "bot@users.noreply.github.com"
          git add site data
          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "chore: daily global story collection $(date -u +%Y-%m-%d)"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push origin master; then
                pushed=true
                break
              fi
              echo "回推被拒（第 ${attempt} 次），5 秒后重试…"
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::搜罗结果未能推回仓库（站点已部署成功）"
              exit 1
            fi
          fi
