# 基督教故事 · 全球故事搜罗源
#
# 目标：从全世界的网站里搜罗「真正的故事」——真人、真事、有经历和转折的
# 宣教纪实、人物见证、传记与患难中的信心。可以是刚发生的，也可以是几十年前的。
# 不是新闻简讯、不是书评书摘、不是灵修小品、不是神学评论；这些由
# src/story_filter.py 在采集后判别并拦截。
#
# category（主题倾向，采集后由 story_filter 复核）:
#   africa 非洲宣教与见证 / china 中国故事 / missionary 宣教士故事
#   giant 属灵伟人 / trial 患难中的信心 / lay 平凡人的见证
# region: 非洲 / 中国 / 中东 / 亚洲 / 拉美 / 欧洲 / 北美 / 大洋洲 / 全球
# parser:
#   rss          直连 RSS，订阅里带全文的优先，站内可直接读完整故事
#   news_search  Google News / GDELT 检索发现（全球范围、多语言、多地区版位）
#
# 想加一个源：照抄一段改 name / url / query / country / language 即可。
# 站点会自动把新发现的域名记录到 data/db/discovered_domains.json，便于继续扩源。

