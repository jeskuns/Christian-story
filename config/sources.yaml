  # ==================== 新增：东亚与东南亚华人信仰聚集地 ====================
  # 台/港/星/马/印尼/日/韩。语言只用 zh / en（翻译管线目前只有英→中，日韩文条目整条不译）。
  # country 会传给 Google News 的 gl/ceid，因此写 TW 就是台湾版结果、HK 就是港版。
  - name: 台灣教會見證
    url: https://news.google.com/rss/search
    category: lay
    parser: news_search
    language: zh
    country: TW
