# 基督教世界故事 · 信息源配置
# category 取值: missionary(宣教士故事), giant(属灵伟人), lay(平信徒见证), devotional(灵修小品)
# parser 取值: rss(优先，含正文与配图，直接摘抄), news_search(关键词发现，以链接+摘要呈现)
#
# 说明：
#   - 故事站以「直接摘抄正文 + 配图」为核心。真实 RSS 源（Desiring God、TGC、Our Daily Bread、
#     Banner of Truth、Challies、5 Minutes、MNN 等）多数在订阅中带有完整正文，采集时会一并抽取，
#     无需跳转即可在站内阅读。
#   - 少数 news_search 源用于全球范围「发现」新故事（Google News / GDELT），以链接形式呈现，
#     其中 GDELT 直链会尝试抓取正文。
#   - 可按需启用/禁用、增删源或调整关键词。

sources:
